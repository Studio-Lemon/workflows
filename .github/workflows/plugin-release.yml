name: Create plugin release zip

on:
  # Allow this workflow to be called from another repo (reusable workflow)
  workflow_call:
    inputs:
      plugin_name:
        description: "Logical plugin name (e.g. lemon-woo). Workflow will append .zip if needed."
        required: true
        type: string
        default: "plugin"
      node_version:
        description: "Node.js version used for plugin build"
        required: false
        type: string
        default: "lts/*"
      deploy_to_satispress:
        description: "Deploy to satispress server"
        required: false
        type: boolean
        default: false
      remote_host:
        description: "Remote SSH host for satispress"
        required: false
        type: string
      remote_port:
        description: "Remote SSH port"
        required: false
        type: number
        default: 22
    secrets:
      deploy_key:
        description: "SSH deploy key for satispress"
        required: false
      remote_user:
        description: "Remote SSH user for satispress"
        required: false

jobs:
  create_zip:
    name: Build release zip
    runs-on: ubuntu-latest
    env:
      PLUGIN_DIR: .
      PLUGIN_NAME: ${{ inputs.plugin_name }}
      BUILD_COMMANDS: |
        yarn install
        yarn run build:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate satispress inputs
        if: ${{ inputs.deploy_to_satispress }}
        env:
          REMOTE_HOST: ${{ inputs.remote_host }}
          REMOTE_USER: ${{ secrets.remote_user }}
          DEPLOY_KEY: ${{ secrets.deploy_key }}
        run: |
          missing=()
          [[ -z "$REMOTE_HOST" ]] && missing+=("remote_host")
          [[ -z "$REMOTE_USER" ]] && missing+=("remote_user secret")
          [[ -z "$DEPLOY_KEY" ]] && missing+=("deploy_key secret")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::deploy_to_satispress is true but the following required inputs are missing: ${missing[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version || 'lts/*' }}
          cache: "yarn"
          cache-dependency-path: ${{ env.PLUGIN_DIR }}/yarn.lock
      - name: Build plugin
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          set -e
          echo "Running build commands in $(pwd)"
          bash -lc "$BUILD_COMMANDS"
      - name: Deploy to satispress
        if: ${{ inputs.deploy_to_satispress }}
        uses: Studio-Lemon/workflows/.github/actions/rsync-to-satispress@main
        with:
          type: plugin
          name: ${{ inputs.plugin_name }}
          remote_host: ${{ inputs.remote_host }}
          remote_port: ${{ inputs.remote_port }}
          remote_user: ${{ secrets.remote_user }}
          deploy_key: ${{ secrets.deploy_key }}
      - name: Create zip archive
        working-directory: ${{ env.PLUGIN_DIR }}
        run: |
          # Create base archive with prefix
          git archive --format=zip --prefix=$PLUGIN_NAME/ HEAD -o $PLUGIN_NAME.zip

          # Create temp directory for adding extra folders
          mkdir -p .zip-temp/$PLUGIN_NAME

          # include dist automatically if present
          if [ -d "dist" ]; then
            cp -r dist .zip-temp/$PLUGIN_NAME/
            (cd .zip-temp && zip -ur ../$PLUGIN_NAME.zip $PLUGIN_NAME/dist)
          fi

          # include blocks automatically if present
          if [ -d "blocks" ]; then
            cp -r blocks .zip-temp/$PLUGIN_NAME/
            (cd .zip-temp && zip -ur ../$PLUGIN_NAME.zip $PLUGIN_NAME/blocks)
          fi

          # Cleanup
          rm -rf .zip-temp

      - name: Release (create GitHub release and upload assets)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.PLUGIN_NAME }}.zip
