name: Release Please

on:
  workflow_call:
    inputs:
      config_file:
        description: "Path to the Release Please configuration file"
        required: false
        type: string
        default: "release-please-config.json"
      manifest_file:
        description: "Path to the Release Please manifest file"
        required: false
        type: string
        default: ".release-please-manifest.json"
    secrets:
      release_please_token:
        description: "PAT used by Release Please to create releases and pull requests"
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A PAT is required because releases created with GITHUB_TOKEN do not trigger other workflows.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.release_please_token }}
          config-file: ${{ inputs.config_file }}
          manifest-file: ${{ inputs.manifest_file }}
